# Fighter Mk1 - Fast and maneuverable light fighter

# Identity
id: fighter_mk1
name: "Fighter Mk1"
theme: space-ships
class_name: fighter

description: >
  Fast and maneuverable light fighter designed for hit-and-run
  tactics. Excellent against other fighters but vulnerable to
  heavy weapons. Relies on speed over armor.

# Grid layout
layout:
  width: 10
  height: 10

# Component placements
components:
  # Weapons (front)
  - component_id: laser_cannon_mk1
    position:
      x: 5
      y: 2
    facing: 0

  - component_id: laser_cannon_mk1
    position:
      x: 4
      y: 2
    facing: 0

  # Defense (center)
  - component_id: light_armor_mk1
    position:
      x: 5
      y: 5
    facing: 0

  # Power (center)
  - component_id: fusion_reactor_small
    position:
      x: 5
      y: 5
    facing: 0

  # Propulsion (rear)
  - component_id: ion_engine_mk1
    position:
      x: 5
      y: 8
    facing: 180

# Resource budgets
resources:
  max_power: 200
  max_weight: 500
  max_slots: 20

# AI behavior
ai:
  movement_style: aggressive
  engagement_range: 80.0
  retreat_threshold: 0.3

# Metadata
tags:
  - fighter
  - fast
  - anti_fighter
  - energy_weapons

cost: 720
build_time: 60
